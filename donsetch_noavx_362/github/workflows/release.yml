# DonSeTch Release (noavx fork) — build prebuilt Linux binaries.
#
# Triggers on tag push (v*). Builds release binaries on Linux x86_64,
# packages them with SHA256 checksums, and creates a draft GitHub
# release with all artifacts attached.
#
# Artifact naming (npm-compatible for the npm wrapper package):
#   donsetch-linux-x64.tar.gz       (Linux x86_64, AVX-capable)
#   donsetch-linux-x64-noavx.tar.gz (Linux x86_64, CPUs WITHOUT AVX)
#
# macOS/Windows builds were removed to keep releases fast; only Linux is
# produced, including the no-AVX variant for Bay Trail CPUs.
#
# The `-noavx` variant is built by build-noavx-linux: it compiles ONNX
# Runtime from source with AVX/AVX2/AVX512 disabled as a SHARED library
# (via scripts/build-onnxruntime-noavx.sh -> vendor/onnx/libonnxruntime.so,
# shipped beside the binary for ort load-dynamic dlopen) and compiles out
# the AVX gate with the `noavx` feature. It runs on a normal AVX runner;
# the produced binary is what runs on SSE2/SSE4.2-only CPUs
# (Bay Trail N3540/J1900, ...).
# The ONNX source build is expensive (~30min-2h), so it is cached.
#
# Build steps mirror ci.yml exactly (same toolchain, same deps).
# The only additions are: binary verification, packaging, checksums.

name: Release

# GITHUB_TOKEN needs contents:write to create releases and
# actions:write to upload artifacts. These are not default in
# restricted repos.
permissions:
  contents: write
  actions: write

on:
  push:
    tags:
      - 'v*'
  # Manual run: build + all gates, no publishing. Used to verify
  # baseline/glibc changes without minting a tag.
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build linux-x64
    # Ubuntu 22.04 = the glibc 2.35 baseline: binaries built here run
    # on every distro from 22.04 up. A newer builder leaks its glibc
    # requirement into the artifact (issue #93: GLIBC_2.39 binaries
    # on 22.04).
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'

      - name: Install NASM + LLD (Linux)
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm lld

      # Cache key: <target>-dep-<DEP_HASH>-rel1 (see ci.yml for the
      # full rationale). The version-insensitive hash is what makes
      # release builds warm: without it, every version bump nukes
      # the dependency cache and every tag build is a cold 15-25
      # min rebuild.
      - name: Compute version-insensitive dep hash
        shell: bash
        run: |
          DEP_HASH=$(python3 - <<'EOF'
          import hashlib, pathlib, re
          h = hashlib.sha256()
          lock = pathlib.Path('Cargo.lock').read_text()
          lock = re.sub(r'name = "donsetch"\nversion = "[^"]+"',
                        'name = "donsetch"', lock)
          h.update(lock.encode())
          for p in sorted(pathlib.Path('.').rglob('Cargo.toml')):
              t = re.sub(r'\n\s*version\s*=\s*"[^"]*"', '', p.read_text())
              h.update(p.name.encode()); h.update(t.encode())
          print(h.hexdigest()[:16])
          EOF
          )
          echo "DEP_HASH=$DEP_HASH" >> "$GITHUB_ENV"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-unknown-linux-gnu-dep-${{ env.DEP_HASH }}-rel2
          add-rust-environment-hash-key: "false"
          cache-on-failure: "true"

      - name: Build
        env:
          # x86_64: target the baseline ISA (SSE2, no AVX) so Rust
          # code runs on QEMU-emulated x86_64 and older CPUs.
          # ONNX Runtime AVX is handled separately via dynamic loading
          # (ort load-dynamic + build-time .so build + runtime AVX gate).
          # Also pin -fuse-ld=lld: bfd 2.38 (22.04) cannot link
          # rustc 1.98 output (.crel).
          RUSTFLAGS: -C target-cpu=x86-64 -C link-arg=-fuse-ld=lld
        run: cargo build --release --locked --features ocr,rerank,http --target x86_64-unknown-linux-gnu
        timeout-minutes: 30

      # NOTE: no in-tree release-mode test sweep here anymore — it
      # re-linked test binaries with fat LTO (~15 min) to re-derive
      # what the payload gates below now prove against the REAL
      # shipping assets (version check, doctor ONNX probe,
      # size floors, dylib presence, QEMU non-AVX run).

      # Verify the binary actually runs — catches broken cross-target
      # builds, missing DLLs, and link-time issues that don't show
      # up as compile errors. Also asserts the binary reports the
      # tagged version: a missed Cargo.toml bump fails here instead
      # of shipping assets that lie about their version.
      - name: Verify binary runs and reports the tag version
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          output=$(./donsetch --version 2>&1 || true)
          if [ -z "$output" ]; then
            echo "ERROR: binary produced no output"
            exit 1
          fi
          echo "OK: $(echo "$output" | head -1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Fork tags carry a _sync suffix (e.g. v3.6.2_sync); the binary
            # reports the plain Cargo.toml version, so compare base only.
            TAGVER="${GITHUB_REF_NAME#v}"; TAGVER="${TAGVER%%_*}"
            if ! echo "$output" | grep -q "$TAGVER"; then
              echo "ERROR: binary does not report the tagged version $TAGVER"
              echo "Did you bump Cargo.toml before tagging?"
              exit 1
            fi
          fi

      # ── Payload integrity gates ────────────────────────────
      # Compile success has shipped dead payloads before (v3.3.0:
      # the ONNX archive was silently absent from win32-x64 and
      # darwin-arm64). These gates are the tripwire: the shipped
      # bytes must be big enough to contain what they claim, the
      # Linux dylib must ship beside the binary, and `doctor` must
      # actually PROBE the ONNX payload instead of printing a
      # cfg constant.
      - name: Payload integrity gates
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          SIZE=$(wc -c < donsetch)
          NEED=15000000; EXPECT="shared library present"
          if [ "$SIZE" -lt "$NEED" ]; then
            echo "payload gate FAIL: donsetch is ${SIZE} bytes, expected >= ${NEED}"
            echo "(a binary this small cannot contain the features it was built with)"
            exit 1
          fi
          if [ ! -f libonnxruntime.so ] || [ "$(wc -c < libonnxruntime.so)" -lt 10000000 ]; then
            echo "payload gate FAIL: libonnxruntime.so missing or too small"
            exit 1
          fi
          OUT=$(./donsetch doctor 2>&1 || true)
          echo "$OUT" | grep -q "ONNX Runtime.*${EXPECT}" || {
            echo "payload gate FAIL: doctor did not report the expected ONNX state"
            echo "$OUT" | grep -i onnx || true
            exit 1
          }
          echo "payload gates ok: ${SIZE} bytes, ONNX probe: ${EXPECT}"

      # ── glibc baseline gate ──────────────────────────────────
      # The binary must not demand any glibc symbol newer than
      # 2.35 (Ubuntu 22.04). This is the hard tripwire for issue
      # #93: building on a newer runner used to leak GLIBC_2.39
      # into the artifact and every 22.04 install refused to start.
      # objdump reads the ACTUAL symbol requirements of the built
      # bytes, so a regression fails the release here, not on a
      # user's VM.
      - name: Verify glibc baseline
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          if ! command -v objdump >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends binutils >/dev/null 2>&1 || true
          fi
          MAXGLIBC=$(objdump -T donsetch | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "max GLIBC version required by the binary: $MAXGLIBC"
          if [ -z "$MAXGLIBC" ]; then
            echo "ERROR: no GLIBC versioned symbols found — objdump failed or binary is static"
            exit 1
          fi
          HIGHER=$(printf '2.35\n%s\n' "$MAXGLIBC" | sort -V | tail -1)
          if [ "$HIGHER" = "$MAXGLIBC" ] && [ "$MAXGLIBC" != "2.35" ]; then
            echo "ERROR: binary requires GLIBC_$MAXGLIBC, exceeds the 2.35 baseline"
            echo "Rebuild on the ubuntu-22.04 leg, or the dependency pulling the new symbol needs pinning"
            exit 1
          fi
          echo "OK: glibc baseline <= 2.35 satisfied"

      # ── QEMU non-AVX verification ────────────────────────────
      #
      # The binary must run on non-AVX CPUs without SIGILL. QEMU's
      # qemu64 CPU model has SSE2 only (no AVX). If the binary crashes
      # here, the ONNX dynamic loading fix is broken. This catches
      # regressions where AVX instructions leak into the base binary.
      - name: Verify no SIGILL on non-AVX CPU (QEMU)
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null 2>&1 || true
          cd target/x86_64-unknown-linux-gnu/release
          # Clear AVX cache so the CPUID check is actually performed.
          rm -f ~/.cache/donsetch/avx.json 2>/dev/null || true
          output=$(qemu-x86_64 -cpu qemu64 ./donsetch --version 2>&1 || true)
          if [ -z "$output" ]; then
            echo "ERROR: binary crashed (SIGILL) on non-AVX CPU (QEMU qemu64)"
            exit 1
          fi
          echo "OK: binary runs on non-AVX CPU (QEMU qemu64)"
          echo "$output" | head -1

      # Package only DonSeTch release assets. The ONNX shared lib ships
      # beside the binary (built by build.rs for runtime dlopen).
      # tar.gz keeps the npm install.js happy (one extraction method).

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf $GITHUB_WORKSPACE/donsetch-linux-x64.tar.gz donsetch libonnxruntime.so

      # ── Checksums ────────────────────────────────────────────
      # sha256sum format: "<hash>  <filename>" — compatible with
      # `sha256sum -c` on Linux/macOS.

      - name: Compute SHA256
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum donsetch-linux-x64.tar.gz | tee donsetch-linux-x64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: donsetch-linux-x64
          path: donsetch-linux-x64.*

  # ── Linux x86_64 no-AVX build ─────────────────────────────
  # For CPUs without AVX (Intel Bay Trail N3540/J1900, ...). ONNX Runtime
  # is compiled from source with AVX disabled as a shared library
  # (scripts/build-onnxruntime-noavx.sh -> vendor/onnx/libonnxruntime.so,
  # shipped beside the binary for ort load-dynamic dlopen) and the AVX
  # gate is compiled out with the `noavx` feature. The ONNX build is
  # cached so subsequent releases skip the ~30min-2h source build.
  # This binary runs on BOTH AVX and non-AVX CPUs — when in doubt,
  # ship/use the noavx build.
  build-noavx-linux:
    name: Build linux-x64-noavx
    runs-on: ubuntu-22.04
    env:
      ORT_TAG: rel-1.24.2

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'

      - name: Install build deps (NASM, ninja, LLD)
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm ninja-build lld

      - name: Cache ONNX Runtime no-AVX build
        uses: actions/cache@v4
        with:
          path: |
            vendor/onnxruntime-noavx
            vendor/onnx
          key: onnx-noavx-${{ runner.os }}-${{ env.ORT_TAG }}
          restore-keys: |
            onnx-noavx-${{ runner.os }}-

      - name: Build ONNX Runtime without AVX (shared lib)
        run: bash ./scripts/build-onnxruntime-noavx.sh --jobs $(nproc)

      - name: Compute version-insensitive dep hash
        shell: bash
        run: |
          DEP_HASH=$(python3 - <<'EOF'
          import hashlib, pathlib, re
          h = hashlib.sha256()
          lock = pathlib.Path('Cargo.lock').read_text()
          lock = re.sub(r'name = "donsetch"\nversion = "[^"]+"',
                        'name = "donsetch"', lock)
          h.update(lock.encode())
          for p in sorted(pathlib.Path('.').rglob('Cargo.toml')):
              t = re.sub(r'\n\s*version\s*=\s*"[^"]*"', '', p.read_text())
              h.update(p.name.encode()); h.update(t.encode())
          print(h.hexdigest()[:16])
          EOF
          )
          echo "DEP_HASH=$DEP_HASH" >> "$GITHUB_ENV"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-x86_64-unknown-linux-gnu-noavx-dep-${{ env.DEP_HASH }}-rel2
          add-rust-environment-hash-key: "false"
          cache-on-failure: "true"

      - name: Build donsetch (noavx)
        env:
          # Baseline ISA only — never native: the point of this binary
          # is running on CPUs without AVX.
          RUSTFLAGS: -C target-cpu=x86-64 -C link-arg=-fuse-ld=lld
        run: cargo build --release --locked --features ocr,rerank,noavx --target x86_64-unknown-linux-gnu
        timeout-minutes: 30

      - name: Verify binary runs and reports the tag version
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          output=$(./donsetch --version 2>&1 || true)
          if [ -z "$output" ]; then
            echo "ERROR: binary produced no output"
            exit 1
          fi
          echo "OK: $(echo "$output" | head -1)"
          # Fork tags carry a _sync suffix (e.g. v3.6.2_sync); the binary
          # reports the plain Cargo.toml version, so compare base only.
          TAGVER="${GITHUB_REF_NAME#v}"; TAGVER="${TAGVER%%_*}"
          if ! echo "$output" | grep -q "$TAGVER"; then
            echo "ERROR: binary does not report the tagged version $TAGVER"
            echo "Did you bump Cargo.toml before tagging?"
            exit 1
          fi
          # The noavx build must self-report its feature set.
          echo "$output" | grep -q "noavx" || echo "NOTE: DONSHEET_FEATURES does not list noavx"

      # ── Payload integrity gates (noavx) ───────────────────
      # Same tripwire idea as the standard leg: the binary must be big
      # enough to contain OCR/rerank, and the SELF-BUILT .so must ship
      # beside it. The .so floor is deliberately NOT the standard leg's
      # 10MB: a source-built shared lib has a different size.
      # TODO: after the first noavx release, calibrate BOTH floors below
      # against the actual artifact sizes (binary NEED + .so sanity) and
      # tighten them so size regressions fail loudly.
      - name: Payload integrity gates (noavx)
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          SIZE=$(wc -c < donsetch)
          NEED=15000000
          if [ "$SIZE" -lt "$NEED" ]; then
            echo "payload gate FAIL: donsetch is ${SIZE} bytes, expected >= ${NEED}"
            exit 1
          fi
          if [ ! -f libonnxruntime.so ]; then
            echo "payload gate FAIL: libonnxruntime.so missing beside the noavx binary"
            exit 1
          fi
          SOSIZE=$(wc -c < libonnxruntime.so)
          if [ "$SOSIZE" -lt 1048576 ]; then
            echo "payload gate FAIL: libonnxruntime.so is only ${SOSIZE} bytes (>1MB sanity)"
            exit 1
          fi
          head -c 4 libonnxruntime.so | grep -q $'\x7fELF' || {
            echo "payload gate FAIL: libonnxruntime.so is not an ELF shared library"
            exit 1
          }
          OUT=$(./donsetch doctor 2>&1 || true)
          echo "$OUT" | grep -q "ONNX Runtime.*shared library loaded" || {
            echo "payload gate FAIL: doctor did not report the noavx ONNX probe"
            echo "$OUT" | grep -i onnx || true
            exit 1
          }
          echo "payload gates ok: binary ${SIZE} bytes, .so ${SOSIZE} bytes, ONNX probe ok"

      # ── glibc baseline gate (noavx leg) ────────────────────
      # Same 2.35 ceiling as the standard leg: the noavx binary must
      # also run on every distro from Ubuntu 22.04 up.
      - name: Verify glibc baseline (noavx)
        shell: bash
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          if ! command -v objdump >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends binutils >/dev/null 2>&1 || true
          fi
          MAXGLIBC=$(objdump -T donsetch | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "max GLIBC version required by the noavx binary: $MAXGLIBC"
          if [ -z "$MAXGLIBC" ]; then
            echo "ERROR: no GLIBC versioned symbols found — objdump failed or binary is static"
            exit 1
          fi
          HIGHER=$(printf '2.35\n%s\n' "$MAXGLIBC" | sort -V | tail -1)
          if [ "$HIGHER" = "$MAXGLIBC" ] && [ "$MAXGLIBC" != "2.35" ]; then
            echo "ERROR: noavx binary requires GLIBC_$MAXGLIBC, exceeds the 2.35 baseline"
            exit 1
          fi
          echo "OK: glibc baseline <= 2.35 satisfied"

      # ── QEMU non-AVX verification (noavx) ──────────────────
      # The whole point of this binary: it must not only START without
      # AVX (like the standard leg) but actually RUN OCR/rerank there.
      # qemu64 has SSE2 only. doctor must pass the real dlopen+commit
      # probe, and the sample scan must OCR to real text.
      - name: QEMU doctor probe (noavx)
        # The sample PDF (ocr-sample-scan.pdf) is for end-user testing, not
        # CI: `fetch` only accepts public http(s) URLs, so there is no OCR
        # smoke here. The doctor probe below (dlopen + commit of the
        # self-built .so on a non-AVX CPU) is the release gate.
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends qemu-user >/dev/null 2>&1 || true
          cd target/x86_64-unknown-linux-gnu/release
          rm -f ~/.cache/donsetch/avx.json 2>/dev/null || true
          qemu-x86_64 -cpu qemu64 ./donsetch doctor 2>&1 | tee /tmp/doctor-noavx-qemu.log
          grep -q "ONNX Runtime.*shared library loaded" /tmp/doctor-noavx-qemu.log || {
            echo "ERROR: noavx doctor probe failed under QEMU qemu64 (no AVX)"
            grep -i onnx /tmp/doctor-noavx-qemu.log || true
            exit 1
          }
          echo "OK: noavx doctor passes on non-AVX CPU (QEMU qemu64)"
        timeout-minutes: 30

      # ── Package ──────────────────────────────────────────
      # tar.gz keeps npm install.js happy (one extraction method).
      # The self-built libonnxruntime.so ships INSIDE the tarball —
      # without it the noavx binary has no ONNX payload.
      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf $GITHUB_WORKSPACE/donsetch-linux-x64-noavx.tar.gz donsetch libonnxruntime.so

      - name: Compute SHA256
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          sha256sum donsetch-linux-x64-noavx.tar.gz | tee donsetch-linux-x64-noavx.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: donsetch-linux-x64-noavx
          path: donsetch-linux-x64-noavx.*

  release:
    name: Create Release
    needs: [build, build-noavx-linux]
    # Dispatch runs exercise build + every gate without publishing.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      # Curated release notes: extract this version's section from
      # CHANGELOG.md so the release page reads like the changelog,
      # not like a commit log. GitHub's auto-generated notes are
      # appended below it.
      #
      # Fork tags carry a _sync suffix (e.g. v3.6.2_sync) that never has
      # an upstream CHANGELOG section — try the full tag first, then the
      # base version ([3.6.2] for v3.6.2_sync), and degrade to a minimal
      # body instead of failing the release if neither exists.
      - name: Build release notes from CHANGELOG
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import os, re
          tag = os.environ["TAG_VERSION"].lstrip("v")
          base = tag.split("_")[0]
          text = ""
          if os.path.exists("CHANGELOG.md"):
              text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[" + re.escape(tag) + r"\] - .*?$", text, re.M) \
              or re.search(r"^## \[" + re.escape(base) + r"\] - .*?$", text, re.M)
          if not m:
              open("RELEASE_BODY.md", "w", encoding="utf-8").write(
                  f"DonSeTch v{tag}\n\nNo CHANGELOG section for [{tag}].\n")
              print(f"RELEASE_BODY.md: fallback — no CHANGELOG section for [{tag}]")
          else:
              start = m.end()
              nxt = re.search(r"^## \[.*?\]", text[start:], re.M)
              section = text[start:start + nxt.start()] if nxt else text[start:]
              header = f"DonSeTch v{tag}\n\n"
              open("RELEASE_BODY.md", "w", encoding="utf-8").write(header + section.strip() + "\n")
              found = re.search(r"\[(.*?)]", m.group(0)).group(1)
              print(f"RELEASE_BODY.md: {len(section.splitlines())} lines from [{found}]")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: RELEASE_BODY.md
          generate_release_notes: true
          files: |
            artifacts/donsetch-*.tar.gz
            artifacts/donsetch-*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
