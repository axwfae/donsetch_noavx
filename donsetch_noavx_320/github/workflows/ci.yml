# DonSeTch CI — build + test on Linux x86_64.
#
# The heavy dependencies need platform-specific setup:
#   boring-sys (BoringSSL): CMake + C/C++ compiler + Go + bindgen (libclang)
#   PDFium (static):         curl + tar (build.rs downloads at build time)
#   oar-ocr (ONNX Runtime):  download-binaries feature fetches at build time
#
# boring-sys needs Go because BoringSSL's build system is Go-based.
# It needs NASM for x86_64 assembly crypto.
#
# Tests run in debug mode (no LTO) for speed. Release builds are
# verified by the release workflow on tag push.
#
# macOS/Windows runners were removed to keep CI fast; Linux covers the
# platform-independent Rust logic and the noavx path.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    # Same "build-test (<platform>)" naming format as upstream so the
    # required-checks contract stays recognizable.
    name: build-test (linux-x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'
          cache: false

      - name: Install NASM
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64-v3

      - name: Test
        run: cargo test --features ocr,rerank,download-binaries --target x86_64-unknown-linux-gnu

      # --all-targets pulls in #[cfg(test)] modules and tests/*.rs,
      # which the default lib+bins pass leaves unlinted.
      - name: Clippy
        run: cargo clippy --features ocr,rerank,download-binaries --all-targets -- -Dwarnings

      - name: Format check
        run: cargo fmt --all -- --check

  # ── Supply chain: licenses + RustSec advisories + sources ──
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check advisories + licenses + bans + sources
        run: cargo deny --all-features check --hide-inclusion-graph

  # ── Fuzz smoke: short bursts on every master push keep the
  # corpus warm and catch shallow panics before users do. Long
  # runs happen locally (fuzz/README). Daemon aborts are the worst
  # failure mode for an MCP server — this is the tripwire.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [extract, charset, paginate, sitemap, feed]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          # -Zbuild-std needs rust-src. We fuzz the GNU target —
          # boring-sys (BoringSSL C++) has no musl cross toolchain
          # here and doesn't need one.
          targets: x86_64-unknown-linux-gnu
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'
      - name: Install build deps (boring-sys)
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends cmake nasm libclang-dev
      - name: Fuzz (90s smoke)
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }} artifacts/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -s none -- -max_total_time=90 -artifact_prefix=artifacts/${{ matrix.target }}/
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # noavx build gate — the OCR/rerank code path must keep compiling with
  # the `noavx` feature (ONNX Runtime linked from ORT_LIB_PATH instead of
  # downloaded AVX binaries). We point ort-sys at a stub library so the
  # build script passes; `cargo check` never actually links it. The real
  # no-AVX binary is built by the release workflow (build-noavx-linux).
  noavx-check:
    name: noavx-check (linux-x86_64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.22.0'
          cache: false

      - name: Install NASM
        timeout-minutes: 5
        run: sudo apt-get update -o Acquire::Retries=5 && sudo apt-get install -y --no-install-recommends nasm

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          key: noavx-check-v1

      - name: Check (noavx feature, stub ONNX library)
        run: |
          mkdir -p /tmp/fake-ort && touch /tmp/fake-ort/libonnxruntime.a
          ORT_LIB_PATH=/tmp/fake-ort cargo check --features ocr,rerank,noavx
